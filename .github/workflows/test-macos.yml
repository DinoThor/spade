name: macOS Tests

on:
  workflow_call:

jobs:
  test-macos:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    name: Python ${{ matrix.python }}

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.15"
        enable-cache: true

    - name: Set up dependencies
      run: |
        uv sync --extra dev

    - name: Install PyJabber server
      run: |
        uv tool install pyjabber

    - name: Run PyJabber in background
      run: |
        pyjabber --database_in_memory > log.txt &
        echo $! > server.pid
        npx wait-port 5222

    - name: Test with pytest
      run: |
        uv run pytest

    - name: Kill server
      if: always()
      shell: bash
      run: |
        PID=$(cat server.pid)
        kill $PID || true
